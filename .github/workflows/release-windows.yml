name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify release tag matches app version
        run: node scripts/check-release-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer and prepare draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          EDGE_GHOSTY_GOOGLE_CLIENT_ID: ${{ vars.EDGE_GHOSTY_GOOGLE_CLIENT_ID }}
          EDGE_GHOSTY_GOOGLE_CLIENT_SECRET: ${{ secrets.EDGE_GHOSTY_GOOGLE_CLIENT_SECRET }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: Edge Ghosty ${{ github.ref_name }}
          releaseBody: >-
            Instalador do Edge Ghosty para Windows 10/11 x64.
            Execute o arquivo `-setup.exe` para instalar. O rascunho pode ser revisado antes de publicar.
          releaseDraft: true
          prerelease: false
